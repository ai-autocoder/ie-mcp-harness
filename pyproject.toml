[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ie-mcp"
version = "1.0.0"
description = "MCP server that drives Microsoft Edge in IE mode (Trident) via the Selenium IEDriver — automate legacy IE-only web apps from any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Francesco Anzalone" }]
keywords = ["mcp", "ie-mode", "internet-explorer", "edge", "selenium", "automation"]
dependencies = ["selenium>=4.14.0,<5"]

[project.optional-dependencies]
# COM access to IE documents (modal dialogs, user-opened tabs). Optional:
# the server starts and lists its tools without it.
win32 = ["pywin32>=306"]

[project.urls]
Homepage = "https://github.com/ai-autocoder/ie-mcp-harness"
Repository = "https://github.com/ai-autocoder/ie-mcp-harness"

# Exposes `ie-mcp` on PATH so MCP clients launch it by name (no python path).
[project.scripts]
ie-mcp = "ie_mcp.cli:main"

# "ie_mcp*" matches the server package and ie_mcp_fixtures (the legacy fixture site,
# shipped so `--selftest` works from a pip install).
[tool.setuptools.packages.find]
include = ["ie_mcp*"]

[tool.setuptools.package-data]
"ie_mcp.js" = ["*.js"]
ie_mcp_fixtures = ["site/*"]
