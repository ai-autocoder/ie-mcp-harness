<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head><title>Fixture form</title><meta http-equiv="X-UA-Compatible" content="IE=7">
</head>
<body>
<h3>Form</h3>
<form id="main_form" name="main_form" method="post" action="/echo">
<table>
<tr><td><label for="code">Code</label></td><td><input type="text" id="code" name="code"></td></tr>
<tr><td><label for="pwd">Password</label></td><td><input type="password" id="pwd" name="pwd"></td></tr>
<tr><td><label for="kind">Kind</label></td><td>
<select id="kind" name="kind">
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
</select>
</td></tr>
<tr><td><label for="notes">Notes</label></td><td><textarea id="notes" name="notes" rows="3" cols="30"></textarea></td></tr>
<tr><td><label for="flag">Flag</label></td><td><input type="checkbox" id="flag" name="flag" value="1"></td></tr>
<tr><td></td><td><input type="submit" id="send" name="send" value="Send"></td></tr>
</table>
</form>
<iframe id="inner" name="inner" src="inner.htm" width="300" height="100"></iframe>
</body>
</html>
